{n:164,dim:"内外向",stem:"放长假第一天，你脑子里先想的是——",opts:["先看看有没有人组局，有就出去","一个人待在家，谁也别来安排我","在家待两天，第三天再想出门","马上约人出去玩，把假期排满"],scores:[2,0,1,3]},
{n:165,dim:"内外向",stem:"一场聚会结束，你回到家关上门——",opts:["还想再聊，翻聊天记录看大家说的话","还行，喝口水缓一会儿就正常了","反而更有劲，还能再约下一场","想一个人待着，谁也别再找我"],scores:[1,2,3,0]},
{n:166,dim:"内外向",stem:"同事下班临时叫你一起去吃个饭，你——",opts:["直接说不去，回家一个人待着最舒服","看是谁叫的，关系好就跟着去","去，正好借这机会跟几个人多聊几句","先找个理由推掉，说下次再约"],scores:[0,2,3,1]},
{n:167,dim:"内外向",stem:"一个人在商场吃饭，旁边桌坐满了人——",opts:["一个人吃正好，不用应付谁","很自然，还能跟老板闲聊两句","还行，边吃边看手机，不受影响","吃得比平时快，吃完就起身走"],scores:[0,3,2,1]},
{n:168,dim:"内外向",stem:"周末两天，没人约你，也没什么安排——",opts:["上午在家待着，下午再约人出门","两天都在家不出门，一个人挺自在","待不住，第一天就约朋友出去逛","看心情，有人叫就出门，没人叫就这么待着"],scores:[2,0,3,1]},
{n:169,dim:"持久力",stem:"一件事做到第三周，开始有点没劲——",opts:["已经成了习惯，不做反而空落落的","差不多就停了，反正也没人催我","歇几天再回来，回来还能接上","换一件新的做，这件先放下"],scores:[3,1,2,0]},
{n:170,dim:"持久力",stem:"学一样新东西，学了一半觉得难——",opts:["卡住也接着啃，啃到弄懂为止","找懂行的人教，跟着他的步骤走","先放一放，等哪天有心情再说","承认自己学不会，这个先放弃"],scores:[3,2,1,0]},
{n:171,dim:"持久力",stem:"一件枯燥但有用的事，摆在你面前——",opts:["做不下去，放两天就彻底忘了","每天做一截，不做完不放手","给自己找点花样，边玩边做","拖着做，不到最后期限不动"],scores:[0,3,2,1]},
{n:172,dim:"持久力",stem:"长项目做到后期，人有点提不起劲——",opts:["能交上就行，细节没再回头看","越到后面越有劲，还想加点东西","明显松了，进度一再往后拖","靠惯性往下推，推得没什么感觉"],scores:[0,3,1,2]},
{n:173,dim:"持久力",stem:"一段处了很多年的关系，你平时——",opts:["顺其自然，有事的时候才出现","不太主动，基本等对方先开口","一直维护，该问候就问候一句","只在过年过节发一句祝福，平时不打扰"],scores:[1,0,3,2]},
{n:174,dim:"持久力",stem:"你给自己定了个每天要做的习惯——",opts:["从每天改到每周三次，还在做","固定在晚上八点做，到点不用想","做一个换一个，总在换新的","定完就放那儿了，没开始过"],scores:[2,3,1,0]},
{n:175,dim:"持久力",stem:"一个想要达成的目标，你会怎么推进——",opts:["拆成本周就能做完的几小步","走一半就忘了当初要干什么","不停换目标，一个都没走到底","先做起来，不行再调方向"],scores:[3,1,0,2]},
{n:176,dim:"持久力",stem:"晨跑坚持了 21 天，出差断了 5 天，回来那天早上下小雨——",opts:["先降一档，每天走二十分钟接回节奏","套上鞋照常出门，回来把下周跑量排好","觉得断了就白练了，干脆不跑了","再歇两天，跟自己约好下周一重来"],scores:[2,3,0,1]},
{n:177,dim:"持久力",stem:"定了个每天早起的目标，执行下去——",opts:["定两个闹钟响三遍，也能爬起来","固定六点半起，到点身体自己醒","要人叫才起得来，没人叫就睡过去","排得太满，根本排不出固定的时间"],scores:[2,3,1,0]},
{n:178,dim:"持久力",stem:"一件已经做了半年的长期项目，现在——",opts:["越做越有劲，还想再开个小分支","开始松了，进度一天天往后拖","只想快点结束，能糊就糊过去","按惯性往下走，提不起兴趣"],scores:[3,1,0,2]},
{n:179,dim:"持久力",stem:"一本书读了两个月，还停在前两章——",opts:["每次翻两页就走神，还停在原处","隔几天读一次，一次读半个小时","每天睡前读半小时，慢慢啃完它","已经收起来了，当作自己读完"],scores:[1,2,3,0]},
{n:180,dim:"持久力",stem:"练了半年的琴，断了半个多月——",opts:["第二天照原时间练，从断掉那首接","缓了快一个月，才重新找回手感","换了个更喜欢的，这回一直练下去了","试了一次跟不上，就没再碰过"],scores:[3,1,2,0]},
{n:181,dim:"持久力",stem:"戒一个跟了很多年的习惯，怎么盯自己——",opts:["没想过记，破没破全凭感觉","在日历上打勾，断了从下一格重来","让别人盯着我，每天报一下","试过几次，破了就当没发生"],scores:[0,3,2,1]},
{n:182,dim:"持久力",stem:"一件事坚持到第三个月，劲头退了——",opts:["歇几天再回来，回来还能做","到点就做，已经不用刻意提醒","开了个新头，这件就搁下了","松下来就停，停了很难再开"],scores:[2,3,0,1]},
{n:183,dim:"持久力",stem:"一件事做了三个月，一点反馈都没有——",opts:["换了个方向做，这个就放下了","心里犯嘀咕，做得比之前松了些","照原节奏继续做，不管有没有人看","找人问一句，这种没反馈还值不值得"],scores:[0,2,3,1]},
{n:184,dim:"持久力",stem:"一样东西练了一阵，你想知道自己有没有进步——",opts:["没想过看进度，练一天算一天","只记结果，比如练成了哪几首","有记录，练到哪儿、卡在哪儿都清楚","感觉有进步，但说不出具体在哪儿"],scores:[0,2,3,1]},
{n:185,dim:"持久力",stem:"有件事每天要做，做完也没人知道——",opts:["换着法子做，免得自己先腻了","干脆当没这个事，谁也不会问","拖到晚上再补，补不完就明天","每天照样做完，做完心里才踏实"],scores:[2,0,1,3]},
{n:186,dim:"持久力",stem:"报了一门要学半年的课，怎么往下推——",opts:["按自己的节奏来，累就少学一点","报了名之后，就再没打开过课","拆成每周的小步，一步步往前推","边走边看，走一步算一步，不规划"],scores:[2,0,3,1]},
{n:187,dim:"持久力",stem:"一个认识十年的老朋友，三个月没联系——",opts:["想着关系在那儿，不联系也散不了","他不找我，我也就慢慢不发了","今天想起来，问一句他最近怎么样","打个电话过去，约个时间见面吃饭"],scores:[1,0,2,3]},
{n:188,dim:"持久力",stem:"想养成一个每天五分钟的小习惯——",opts:["想起来了做一次，忙起来就搁着","还没试过，估计坚持不下来","定个闹钟，到点响了起来做","打卡记录连续天数，断了就重来"],scores:[1,0,2,3]},
{n:189,dim:"持久力",stem:"说好的早睡，这周天天被事拖到一点——",opts:["改成十一点先躺下，睡不着也闭着眼","干脆不早睡了，反正也睡不成","把事切开，到点先睡，剩下的明天做","先让位给眼前的事，过了这阵再说"],scores:[2,0,3,1]},
{n:190,dim:"持久力",stem:"一件长期在做的事，最近明显懒了——",opts:["做一阵停一阵，等劲头回来再开","照样按老规矩做，懒也先做上","基本坚持不了，早就已经停了","把标准降下来，还做但只做最低那档"],scores:[1,3,0,2]},
{n:191,dim:"持久力",stem:"一件事坚持到一半，中间出了问题——",opts:["拖着先不动，等别人来催我一下","直接停了，这件事就到此为止","想办法解决，把断掉的接回来","先停一下，把事情处理完再回来"],scores:[1,0,3,2]},
{n:192,dim:"持久力",stem:"坚持了两年的一件事，最近发现方向可能选错了——",opts:["先继续做着，不想又白费两年","想清楚错在哪，该调就调，继续往前走","全都放下，重新找一件事开始","停在那儿，不知道该继续还是放弃"],scores:[2,3,1,0]},

function pickPaper(){
  const out = [];
  DIMS.forEach(function(d){
    const pool = Q.filter(function(q){ return q.dim === d; });
    for (let k = pool.length - 1; k > 0; k--) { const j = Math.floor(Math.random()*(k+1)); const t=pool[k];pool[k]=pool[j];pool[j]=t; }
    out.push.apply(out, pool.slice(0, 8));
  });
  for (let k = out.length - 1; k > 0; k--) { const j = Math.floor(Math.random()*(k+1)); const t=out[k];out[k]=out[j];out[j]=t; }
  return out;
}
function nearest(sc){
  // 按满分归一到 4-22 尺度（与人物向量同尺度），不中心化
  const perDim = PAPER.length / 8;
  const maxScore = perDim * 3;
  const u = DIMS.map(function(d){ return 4 + sc[d] / maxScore * 18; });
  let best=null, bd=1e9, second=null, sd=1e9;
  PEOPLE.forEach(function(p){
    let s=0;
    for (let i=0;i<8;i++){ const t=p.vec[i]-u[i]; s+=t*t; }
    let d=Math.sqrt(s);
    // 性别只是倾向：非所选方向的人物，距离放大 8%（更不容易被选中，但不是不可能）
    if (GENDER !== 'all' && p.gender !== GENDER) d = d * 1.08;
    if(d < bd - 0.5 || (Math.abs(d-bd) <= 0.5 && p.fame > (best ? best.fame : -1))){
      second=best; sd=bd; best=p; bd=d;
    } else if(d<sd){ second=p; sd=d; }
  });
  return {best:best, d:bd, second:second, sd:sd};
}

function quality(){
  const mins = (T1-T0)/60000;
  const flags = [];
  if (mins < 5) flags.push('作答用时 ' + mins.toFixed(1) + ' 分钟，偏快');
  let run=1, mr=1;
  for (let k=1;k<A.length;k++){ if(A[k]===A[k-1]){run++;if(run>mr)mr=run;} else run=1; }
  if (mr >= 10) flags.push('有连续 ' + mr + ' 题选同一位置');
  return {flags:flags, maxrun:mr};
}

function saveCard(){

    const W = 1080, PAD = 90;
    const g0 = document.createElement('canvas').getContext('2d');
    // ---- 先排版：算出每一块的高度 ----
    const blocks = [];
    blocks.push({t:'eyebrow', s:'ATLAS · 你的档案'});

    blocks.push({t:'meta', s:p.era + ' · ' + p.role});

    parts.forEach(function(x){ blocks.push({t:'h', s:x.h}); blocks.push({t:'p', s:x.p}); });
    blocks.push({t:'foot', s:'传统民俗 · AI 整理 · 仅供自我了解'});

    function fontOf(t){
      if (t==='eyebrow') return '26px sans-serif';
      if (t==='name') return '104px "STKaiti","KaiTi",serif';
      if (t==='meta') return '38px sans-serif';
      if (t==='intro') return '28px sans-serif';
      if (t==='quote') return '40px "STKaiti","KaiTi",serif';
      if (t==='h') return '34px "STKaiti","KaiTi",serif';
      if (t==='p') return '30px sans-serif';
      if (t==='foot') return '24px sans-serif';
      return '30px sans-serif';
    }
    function wrapLines(text, font, maxW){
      g0.font = font;
      const lines = []; let line = '';
      for (const ch of String(text)) {
        if (g0.measureText(line + ch).width > maxW) { lines.push(line); line = ch; }
        else line += ch;
      }
      if (line) lines.push(line);
      return lines;
    }
    let y = 70;
    blocks.forEach(function(b){
      if (b.t==='hr') { y += 40; return; }
      if (b.t==='dims') { y += 8*92 + 30; return; }
      const f = fontOf(b.t);
      const maxW = W - PAD*2;
      if (b.t==='name') { y += 130; return; }
      if (b.t==='quote') { const ls = wrapLines(b.s, f, maxW); y += ls.length*54 + 40; b._lines = ls; return; }
      const lh = b.t==='p' ? 48 : (b.t==='h' ? 46 : 40);
      const ls = wrapLines(b.s, f, maxW);
      b._lines = ls;
      y += ls.length*lh + (b.t==='h' ? 14 : 26);
    });
    const H = Math.max(1200, y + 90);

    // ---- 再绘制 ----
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = '#F5F4F2'; g.fillRect(0, 0, W, H);
    g.textAlign = 'center';

    let cy = 70;
    blocks.forEach(function(b){
      if (b.t==='hr') {
        g.strokeStyle = '#EAE0D3'; g.lineWidth = 2;
        g.beginPath(); g.moveTo(PAD, cy); g.lineTo(W-PAD, cy); g.stroke();
        cy += 40; return;
      }
      if (b.t==='dims') {
        cy += 8;
        order.forEach(function(d, idx){
          const pct = (100 - idx*8)/100;
          g.textAlign = 'left'; g.fillStyle = '#5A4A40'; g.font = '30px sans-serif';
          g.fillText(d, PAD, cy);
          g.textAlign = 'right'; g.fillStyle = '#A8988A'; g.font = '26px sans-serif';
          g.fillText('第' + (idx+1) + '位', W-PAD, cy);
          g.fillStyle = '#EAE0D3'; g.fillRect(PAD, cy+16, W-PAD*2, 12);
          g.fillStyle = idx < 3 ? '#B5651D' : '#D9B99B'; g.fillRect(PAD, cy+16, (W-PAD*2)*pct, 12);
          cy += 92;
        });
        cy += 30; return;
      }
      if (b.t==='name') {
        g.textAlign = 'center'; g.fillStyle = '#3A2E2A'; g.font = fontOf('name');
        g.fillText(b.s, W/2, cy + 96); cy += 130; return;
      }
      if (b.t==='eyebrow') { g.textAlign='center'; g.fillStyle='#A8988A'; g.font=fontOf('eyebrow'); g.fillText(b.s, W/2, cy+26); cy += 60; return; }
      if (b.t==='meta') { g.textAlign='center'; g.fillStyle='#8A7B70'; g.font=fontOf('meta'); g.fillText(b.s, W/2, cy+38); cy += 78; return; }
      if (b.t==='intro') { g.textAlign='center'; g.fillStyle='#8A7B70'; g.font=fontOf('intro'); g.fillText(b.s, W/2, cy+34); cy += 70; return; }
      if (b.t==='quote') {
        g.textAlign='center'; g.fillStyle='#B5651D'; g.font=fontOf('quote');
        (b._lines||[b.s]).forEach(function(l, k){ g.fillText(l, W/2, cy+46+k*54); });
        cy += (b._lines||[b.s]).length*54 + 40; return;
      }
      if (b.t==='h') {
        g.textAlign='left'; g.fillStyle='#B5651D'; g.font=fontOf('h');
        g.fillText(b.s, PAD, cy+40); cy += 46 + 14; return;
      }
      if (b.t==='p') {
        g.textAlign='left'; g.fillStyle='#5A4A40'; g.font=fontOf('p');
        (b._lines||[b.s]).forEach(function(l, k){ g.fillText(l, PAD, cy+40+k*48); });
        cy += (b._lines||[b.s]).length*48 + 26; return;
      }
      if (b.t==='foot') {
        g.textAlign='center'; g.fillStyle='#B3A596'; g.font=fontOf('foot');
        g.fillText(b.s, W/2, H-50); return;
      }
    });

    const dataUrl = c.toDataURL('image/png');
    const a = document.createElement('a');
    a.download = '你像' + p.name + '.png';
    a.href = dataUrl;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    const img = new Image();
    img.src = dataUrl;
    img.style.cssText = 'width:100%;border-radius:16px;margin-top:16px';
    const box = document.getElementById('card-box');
    box.innerHTML = ''; box.appendChild(img);
    const tip = document.createElement('div');
    tip.className = 'note'; tip.style.textAlign = 'center';
    tip.textContent = '已下载一份；手机可长按图片保存';
    box.appendChild(tip);
    box.scrollIntoView({behavior:'smooth'});
  } catch (e) {
    alert('生成图片失败：' + e.message);
  }
}
function copyIt(){
  const txt = window.__txt || '';
  const ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); alert('已复制，粘给我就行'); }
  catch(e){ alert('复制失败，手动选吧：\n'+txt); }
  document.body.removeChild(ta);
}
